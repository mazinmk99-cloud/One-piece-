<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>One Piece - Luffy Character Test</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; touch-action: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 15px; left: 15px; color: white; font-family: sans-serif; font-weight: bold; text-shadow: 2px 2px 4px #000; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="ui">
    <h2>MONKEY D. LUFFY</h2>
    <p>Alabasta Kingdom - Preview</p>
</div>

<script>
    // 1. Scene setup, Camera & Renderer
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // Alabasta Blue Sky
    scene.fog = new THREE.FogExp2(0xedc9af, 0.012); // Desert Sand Fog

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 6);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfffaed, 0.9);
    dirLight.position.set(10, 20, 10);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // Ground Floor (Desert Sand)
    const sandGeo = new THREE.PlaneGeometry(100, 100);
    const sandMat = new THREE.MeshStandardMaterial({ color: 0xedc9af, roughness: 0.9 });
    const ground = new THREE.Mesh(sandGeo, sandMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // =====================================================
    // 2. IMPROVED LUFFY-STYLE CHARACTER
    // =====================================================

    const luffyGroup = new THREE.Group();

    // MATERIALS
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xf0b27a, roughness: 0.65 });
    const redVestMat = new THREE.MeshStandardMaterial({ color: 0xc91429, roughness: 0.5 });
    const redDarkMat = new THREE.MeshStandardMaterial({ color: 0x8e0d1d, roughness: 0.6 });
    const blueShortsMat = new THREE.MeshStandardMaterial({ color: 0x1769aa, roughness: 0.65 });
    const yellowSashMat = new THREE.MeshStandardMaterial({ color: 0xf4c430, roughness: 0.55 });
    const strawMat = new THREE.MeshStandardMaterial({ color: 0xe6b84f, roughness: 0.85 });
    const hatRedMat = new THREE.MeshStandardMaterial({ color: 0xb51225, roughness: 0.5 });
    const brownMat = new THREE.MeshStandardMaterial({ color: 0x7a421d, roughness: 0.8 });
    const blackMat = new THREE.MeshStandardMaterial({ color: 0x101010, roughness: 0.4 });
    const whiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });

    // HELPER
    function addPart(mesh) {
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        luffyGroup.add(mesh);
        return mesh;
    }

    // LEGS
    const legGeo = new THREE.CapsuleGeometry(0.115, 0.78, 8, 16);
    const leftLeg = addPart(new THREE.Mesh(legGeo, skinMat));
    leftLeg.position.set(-0.21, 0.72, 0);

    const rightLeg = addPart(new THREE.Mesh(legGeo, skinMat));
    rightLeg.position.set(0.21, 0.72, 0);

    // FEET / SANDALS
    const footGeo = new THREE.BoxGeometry(0.27, 0.11, 0.48);
    const leftFoot = addPart(new THREE.Mesh(footGeo, brownMat));
    leftFoot.position.set(-0.21, 0.28, 0.08);

    const rightFoot = addPart(new THREE.Mesh(footGeo, brownMat));
    rightFoot.position.set(0.21, 0.28, 0.08);

    const strapGeo = new THREE.BoxGeometry(0.055, 0.08, 0.28);
    const leftStrap = addPart(new THREE.Mesh(strapGeo, brownMat));
    leftStrap.position.set(-0.21, 0.35, 0.06);
    leftStrap.rotation.x = -0.35;

    const rightStrap = addPart(new THREE.Mesh(strapGeo, brownMat));
    rightStrap.position.set(0.21, 0.35, 0.06);
    rightStrap.rotation.x = -0.35;

    // BLUE SHORTS
    const waistGeo = new THREE.CylinderGeometry(0.40, 0.40, 0.48, 24);
    const shorts = addPart(new THREE.Mesh(waistGeo, blueShortsMat));
    shorts.position.y = 1.42;

    // YELLOW SASH
    const sashGeo = new THREE.CylinderGeometry(0.43, 0.43, 0.18, 24);
    const sash = addPart(new THREE.Mesh(sashGeo, yellowSashMat));
    sash.position.y = 1.68;

    const sashTailGeo = new THREE.BoxGeometry(0.18, 0.52, 0.08);
    const sashTail = addPart(new THREE.Mesh(sashTailGeo, yellowSashMat));
    sashTail.position.set(0.30, 1.40, 0.10);
    sashTail.rotation.z = -0.15;

    // TORSO / CHEST
    const chestGeo = new THREE.CapsuleGeometry(0.34, 0.65, 8, 20);
    const chest = addPart(new THREE.Mesh(chestGeo, skinMat));
    chest.position.y = 2.25;

    // OPEN RED VEST
    const vestGeo = new THREE.BoxGeometry(0.22, 0.88, 0.16);
    const leftVest = addPart(new THREE.Mesh(vestGeo, redVestMat));
    leftVest.position.set(-0.31, 2.31, 0.31);
    leftVest.rotation.z = -0.05;

    const rightVest = addPart(new THREE.Mesh(vestGeo, redVestMat));
    rightVest.position.set(0.31, 2.31, 0.31);
    rightVest.rotation.z = 0.05;

    const vestBottomGeo = new THREE.BoxGeometry(0.66, 0.10, 0.16);
    const vestBottom = addPart(new THREE.Mesh(vestBottomGeo, redDarkMat));
    vestBottom.position.set(0, 1.91, 0.31);

    // NECK
    const neckGeo = new THREE.CylinderGeometry(0.14, 0.16, 0.27, 20);
    const neck = addPart(new THREE.Mesh(neckGeo, skinMat));
    neck.position.y = 2.92;

    // SHOULDERS
    const shoulderGeo = new THREE.SphereGeometry(0.18, 20, 20);
    const leftShoulder = addPart(new THREE.Mesh(shoulderGeo, skinMat));
    leftShoulder.position.set(-0.47, 2.63, 0);

    const rightShoulder = addPart(new THREE.Mesh(shoulderGeo, skinMat));
    rightShoulder.position.set(0.47, 2.63, 0);

    // ARMS
    const armGeo = new THREE.CapsuleGeometry(0.09, 0.68, 8, 16);
    const leftArm = addPart(new THREE.Mesh(armGeo, skinMat));
    leftArm.position.set(-0.55, 2.20, 0);
    leftArm.rotation.z = -0.10;

    const rightArm = addPart(new THREE.Mesh(armGeo, skinMat));
    rightArm.position.set(0.55, 2.20, 0);
    rightArm.rotation.z = 0.10;

    // HANDS
    const handGeo = new THREE.SphereGeometry(0.115, 20, 20);
    const leftHand = addPart(new THREE.Mesh(handGeo, skinMat));
    leftHand.position.set(-0.59, 1.78, 0);

    const rightHand = addPart(new THREE.Mesh(handGeo, skinMat));
    rightHand.position.set(0.59, 1.78, 0);

    // HEAD
    const headGeo = new THREE.SphereGeometry(0.39, 40, 32);
    const head = addPart(new THREE.Mesh(headGeo, skinMat));
    head.position.set(0, 3.34, 0);

    // EARS
    const earGeo = new THREE.SphereGeometry(0.10, 16, 16);
    const leftEar = addPart(new THREE.Mesh(earGeo, skinMat));
    leftEar.position.set(-0.38, 3.34, 0);

    const rightEar = addPart(new THREE.Mesh(earGeo, skinMat));
    rightEar.position.set(0.38, 3.34, 0);

    // EYES
    const eyeWhiteGeo = new THREE.SphereGeometry(0.065, 16, 16);
    const leftEye = addPart(new THREE.Mesh(eyeWhiteGeo, whiteMat));
    leftEye.position.set(-0.13, 3.39, 0.36);

    const rightEye = addPart(new THREE.Mesh(eyeWhiteGeo, whiteMat));
    rightEye.position.set(0.13, 3.39, 0.36);

    const pupilGeo = new THREE.SphereGeometry(0.027, 12, 12);
    const leftPupil = addPart(new THREE.Mesh(pupilGeo, blackMat));
    leftPupil.position.set(-0.13, 3.39, 0.415);

    const rightPupil = addPart(new THREE.Mesh(pupilGeo, blackMat));
    rightPupil.position.set(0.13, 3.39, 0.415);

    // SMILE
    const mouthGeo = new THREE.TorusGeometry(0.075, 0.018, 8, 16, Math.PI);
    const mouth = addPart(new THREE.Mesh(mouthGeo, blackMat));
    mouth.position.set(0, 3.18, 0.37);
    mouth.rotation.x = Math.PI;

    // HAIR
    const hairGeo = new THREE.SphereGeometry(0.40, 32, 20);
    const hair = addPart(new THREE.Mesh(hairGeo, blackMat));
    hair.position.set(0, 3.57, 0);
    hair.scale.set(1.02, 0.60, 1.02);

    // STRAW HAT
    const hatBrimGeo = new THREE.CylinderGeometry(0.68, 0.68, 0.10, 40);
    const hatBrim = addPart(new THREE.Mesh(hatBrimGeo, strawMat));
    hatBrim.position.y = 3.70;

    const hatTopGeo = new THREE.CylinderGeometry(0.36, 0.42, 0.38, 32);
    const hatTop = addPart(new THREE.Mesh(hatTopGeo, strawMat));
    hatTop.position.y = 3.91;

    const hatBandGeo = new THREE.CylinderGeometry(0.405, 0.405, 0.09, 32);
    const hatBand = addPart(new THREE.Mesh(hatBandGeo, hatRedMat));
    hatBand.position.y = 3.82;

    luffyGroup.position.set(0, 0, 0);
    scene.add(luffyGroup);

    // Render Animation Loop
    function animate() {
        requestAnimationFrame(animate);
        luffyGroup.rotation.y += 0.01; // Character Display Rotate
        renderer.render(scene, camera);
    }
    animate();

    // Screen Resize Adjustment
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
