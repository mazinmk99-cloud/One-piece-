<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>One Piece - Alabasta World</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; touch-action: none; font-family: sans-serif; }
        canvas { display: block; }
        #ui { position: absolute; top: 15px; left: 15px; color: white; font-weight: bold; text-shadow: 2px 2px 4px #000; pointer-events: none; }
        
        /* Touch Controls */
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.2); border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); }
        #joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(255,255,255,0.8); border-radius: 50%; }
        #attack-btn { position: absolute; bottom: 40px; right: 40px; width: 80px; height: 80px; background: #d90429; color: white; border-radius: 50%; border: 3px solid white; font-weight: bold; font-size: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #attack-btn:active { transform: scale(0.9); background: #ef233c; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="ui">
    <h2>MONKEY D. LUFFY</h2>
    <p>Location: Alabasta Kingdom - World Explorer</p>
</div>

<div id="joystick-zone"><div id="joystick-knob"></div></div>
<button id="attack-btn">PUNCH</button>

<script>
    // 1. Scene & Camera Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xdce7eb);
    scene.fog = new THREE.FogExp2(0xedc9af, 0.008);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xfff3e0, 0.8);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffeeaa, 1.0);
    sunLight.position.set(50, 80, 30);
    sunLight.castShadow = true;
    scene.add(sunLight);

    // Desert Ground
    const sandGeo = new THREE.PlaneGeometry(500, 500);
    const sandMat = new THREE.MeshStandardMaterial({ color: 0xe6be8a, roughness: 0.9 });
    const ground = new THREE.Mesh(sandGeo, sandMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // 2. World Building Objects
    const buildingMat = new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.8 });
    const woodMat = new THREE.MeshStandardMaterial({ color: 0x6b4226 });
    const leafMat = new THREE.MeshStandardMaterial({ color: 0x2d6a4f });

    function createPyramid(x, z, radius, height) {
        const mesh = new THREE.Mesh(new THREE.ConeGeometry(radius, height, 4), buildingMat);
        mesh.position.set(x, height / 2, z);
        mesh.rotation.y = Math.PI / 4;
        mesh.castShadow = true;
        scene.add(mesh);
    }

    function createHouse(x, z) {
        const houseGroup = new THREE.Group();
        const base = new THREE.Mesh(new THREE.BoxGeometry(6, 5, 6), buildingMat);
        base.position.y = 2.5;
        base.castShadow = true;
        houseGroup.add(base);

        const dome = new THREE.Mesh(new THREE.SphereGeometry(2.5, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2), buildingMat);
        dome.position.y = 5;
        houseGroup.add(dome);

        houseGroup.position.set(x, 0, z);
        scene.add(houseGroup);
    }

    function createPalmTree(x, z) {
        const treeGroup = new THREE.Group();
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 6, 8), woodMat);
        trunk.position.y = 3;
        trunk.castShadow = true;
        treeGroup.add(trunk);

        for (let i = 0; i < 5; i++) {
            const leaf = new THREE.Mesh(new THREE.BoxGeometry(3, 0.1, 1), leafMat);
            leaf.position.set(0, 5.8, 0);
            leaf.rotation.y = (i * Math.PI) / 2.5;
            leaf.rotation.z = -0.3;
            treeGroup.add(leaf);
        }
        treeGroup.position.set(x, 0, z);
        scene.add(treeGroup);
    }

    // World Building Spawns
    createPyramid(-40, -50, 25, 30);
    createPyramid(50, -80, 35, 45);
    createHouse(-15, -20);
    createHouse(-25, -20);
    createHouse(20, -25);
    createPalmTree(-8, -12);
    createPalmTree(10, -15);
    createPalmTree(25, -30);

    // 3. Luffy Character Setup
    const luffyGroup = new THREE.Group();

    const skinMat = new THREE.MeshStandardMaterial({ color: 0xf0b27a });
    const redVestMat = new THREE.MeshStandardMaterial({ color: 0xc91429 });
    const blueShortsMat = new THREE.MeshStandardMaterial({ color: 0x1769aa });
    const yellowSashMat = new THREE.MeshStandardMaterial({ color: 0xf4c430 });
    const strawMat = new THREE.MeshStandardMaterial({ color: 0xe6b84f });
    const hatRedMat = new THREE.MeshStandardMaterial({ color: 0xb51225 });
    const blackMat = new THREE.MeshStandardMaterial({ color: 0x101010 });

    function addPart(mesh) {
        mesh.castShadow = true;
        luffyGroup.add(mesh);
        return mesh;
    }

    const legGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.8, 16);
    const leftLeg = addPart(new THREE.Mesh(legGeo, skinMat)); leftLeg.position.set(-0.21, 0.4, 0);
    const rightLeg = addPart(new THREE.Mesh(legGeo, skinMat)); rightLeg.position.set(0.21, 0.4, 0);

    addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.38, 0.5, 16), blueShortsMat)).position.y = 1.05;
    addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.41, 0.41, 0.18, 16), yellowSashMat)).position.y = 1.35;
    addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.8, 16), skinMat)).position.y = 1.8;

    const vestL = addPart(new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.82, 0.35), redVestMat)); vestL.position.set(-0.22, 1.8, 0.05);
    const vestR = addPart(new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.82, 0.35), redVestMat)); vestR.position.set(0.22, 1.8, 0.05);

    const armGeo = new THREE.CylinderGeometry(0.09, 0.09, 0.7, 16);
    const leftArm = addPart(new THREE.Mesh(armGeo, skinMat)); leftArm.position.set(-0.5, 1.8, 0);
    const rightArm = addPart(new THREE.Mesh(armGeo, skinMat)); rightArm.position.set(0.5, 1.8, 0);

    addPart(new THREE.Mesh(new THREE.SphereGeometry(0.35, 24, 24), skinMat)).position.set(0, 2.5, 0);
    addPart(new THREE.Mesh(new THREE.SphereGeometry(0.37, 16, 16), blackMat)).position.set(0, 2.6, -0.05);

    addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 0.08, 32), strawMat)).position.y = 2.8;
    addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.4, 0.35, 24), strawMat)).position.y = 2.98;
    addPart(new THREE.Mesh(new THREE.CylinderGeometry(0.405, 0.405, 0.1, 24), hatRedMat)).position.y = 2.88;

    scene.add(luffyGroup);

    // 4. Controls
    let moveData = { x: 0, y: 0 };
    const zone = document.getElementById('joystick-zone');
    const knob = document.getElementById('joystick-knob');

    zone.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        const rect = zone.getBoundingClientRect();
        let x = touch.clientX - rect.left - 60;
        let y = touch.clientY - rect.top - 60;
        let dist = Math.hypot(x, y);
        if (dist > 35) { x *= 35 / dist; y *= 35 / dist; }
        knob.style.transform = `translate(${x}px, ${y}px)`;
        moveData.x = x / 35;
        moveData.y = y / 35;
    });

    zone.addEventListener('touchend', () => {
        knob.style.transform = `translate(0px, 0px)`;
        moveData = { x: 0, y: 0 };
    });

    let isAttacking = false;
    document.getElementById('attack-btn').addEventListener('touchstart', (e) => {
        e.preventDefault();
        if(!isAttacking) {
            isAttacking = true;
            let stretch = 0;
            const interval = setInterval(() => {
                stretch += 0.2;
                rightArm.scale.set(1, 1 + stretch * 2, 1);
                rightArm.position.z = stretch;
                if(stretch > 1.2) {
                    clearInterval(interval);
                    rightArm.scale.set(1, 1, 1);
                    rightArm.position.z = 0;
                    isAttacking = false;
                }
            }, 30);
        }
    });

    // Loop
    let walkCycle = 0;
    function animate() {
        requestAnimationFrame(animate);

        if (Math.abs(moveData.x) > 0.1 || Math.abs(moveData.y) > 0.1) {
            luffyGroup.position.x += moveData.x * 0.12;
            luffyGroup.position.z += moveData.y * 0.12;
            luffyGroup.rotation.y = Math.atan2(moveData.x, moveData.y);

            walkCycle += 0.18;
            leftLeg.rotation.x = Math.sin(walkCycle) * 0.5;
            rightLeg.rotation.x = -Math.sin(walkCycle) * 0.5;
            leftArm.rotation.x = -Math.sin(walkCycle) * 0.5;
            if(!isAttacking) rightArm.rotation.x = Math.sin(walkCycle) * 0.5;
        } else {
            leftLeg.rotation.x = 0; rightLeg.rotation.x = 0; leftArm.rotation.x = 0;
            if(!isAttacking) rightArm.rotation.x = 0;
        }

        camera.position.set(luffyGroup.position.x, luffyGroup.position.y + 4, luffyGroup.position.z + 8);
        camera.lookAt(luffyGroup.position.x, luffyGroup.position.y + 1.5, luffyGroup.position.z);

        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
